[build-system]
requires = ["hatchling>=1.25"]
build-backend = "hatchling.build"

[project]
name = "viirs-candidate-audit"
version = "0.1.0"
description = "A reproducible sensitivity audit of public VIIRS known and candidate fire detections."
readme = "README.md"
requires-python = ">=3.10"
license = {file = "LICENSE"}
authors = [{name = "Wenxing Yi"}]
dependencies = [
  "matplotlib>=3.8",
  "numpy>=1.26",
  "pandas>=2.1",
  "pyarrow>=15",
  "PyYAML>=6.0",
]

[project.optional-dependencies]
dev = ["pytest>=8", "pytest-cov>=5"]

[project.scripts]
viirs-candidate-audit = "viirs_candidate_audit.cli:main"

[tool.hatch.build.targets.wheel]
packages = ["src/viirs_candidate_audit"]

[tool.pytest.ini_options]
addopts = "-q"
testpaths = ["tests"]

